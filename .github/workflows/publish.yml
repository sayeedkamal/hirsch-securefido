name: Publish

# Publishes to PyPI on a version tag, using Trusted Publishing (OIDC), so no
# API token is stored in the repository. Configure the publisher once at:
#   https://pypi.org/manage/project/hirsch-securefido/settings/publishing/  (owner: sayeedkamal)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pip install tomli
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(python -c "import tomli;print(tomli.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag packaged=$pkg"
          test "$tag" = "$pkg" || { echo "tag/version mismatch"; exit 1; }

      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hirsch-securefido
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  homebrew:
    name: Bump the Homebrew formula
    needs: pypi
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Update formula url and sha256 from the published sdist
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          info=$(curl -fsSL "https://pypi.org/pypi/hirsch-securefido/${version}/json")
          url=$(echo "$info" | python3 -c "import json,sys;d=json.load(sys.stdin);print(next(u['url'] for u in d['urls'] if u['packagetype']=='sdist'))")
          sha=$(echo "$info" | python3 -c "import json,sys;d=json.load(sys.stdin);print(next(u['digests']['sha256'] for u in d['urls'] if u['packagetype']=='sdist'))")
          echo "url=$url"
          echo "sha=$sha"
          echo "Update hirschsecure/homebrew-tap with the values above."
          echo "Set HOMEBREW_TAP_TOKEN and enable the push step to automate this."
