name: Publish

# Publishes to PyPI on a version tag, using Trusted Publishing (OIDC), so no
# API token is stored in the repository. Configure the publisher once at:
#   https://pypi.org/manage/project/hirsch-securefido/settings/publishing/  (owner: sayeedkamal)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pip install tomli
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(python -c "import tomli;print(tomli.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag packaged=$pkg"
          test "$tag" = "$pkg" || { echo "tag/version mismatch"; exit 1; }

      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hirsch-securefido
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
