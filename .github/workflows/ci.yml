name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-13, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

      - name: Mutation check (proves the suite detects real bugs)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: python scripts/mutation_check.py

      - name: Smoke test the CLI without hardware
        shell: bash
        run: |
          hirsch-securefido --version
          hirsch-securefido --help
          # No authenticator on a CI runner: must exit 2, not crash.
          set +e
          hirsch-securefido info
          code=$?
          set -e
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }

  formula:
    name: Validate the Homebrew formula
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The real acceptance check that cannot run on a Windows dev box:
      # Ruby actually parses the formula, and brew audits its style.
      - name: Ruby syntax check
        run: ruby -c Formula/hirsch-securefido.rb

      - name: Homebrew style audit
        run: |
          brew style Formula/hirsch-securefido.rb || \
            echo "::warning::brew style reported issues"

      # A full `brew install` is only meaningful once the sdist is on PyPI,
      # since the formula's top-level url points at the published tarball.
      - name: Note the install gate
        run: |
          if grep -q REPLACE_WITH_SDIST_SHA256 Formula/hirsch-securefido.rb; then
            echo "::notice::Formula still has a placeholder sha256; \
          brew install is deferred until the sdist is published."
          fi

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
